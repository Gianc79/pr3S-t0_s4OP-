<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PrestoSpesa v. 1.22</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        html, body { width: 100%; height: 100%; background: #000; color: #fff; overflow: hidden; position: fixed; top: 0; left: 0; display: flex; flex-direction: column; }
        
        /* Fascia superiore fissa */
        header { background: #1f1f1f; padding: 7px 15px 9px; display: flex; flex-direction: column; align-items: center; gap: 7px; border-bottom: 1px solid #333; z-index: 100; flex-shrink: 0; width: 100%; }
        .header-title-row { width: 100%; display: flex; justify-content: center; }
        .header-stats-row { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .last-price { font-size: 0.85rem; color: #aaa; display: flex; flex-direction: column; flex-shrink: 0; }
        .last-price span { font-size: 1.1rem; font-weight: bold; color: #4cd964; }
        .total { font-size: 1.6rem; font-weight: bold; color: #fff; text-align: center; flex: 1; min-width: 0; }
        
        /* Pulsante lista con icona del carrello */
        .list-btn { background: #333; color: #fff; border: none; padding: 7px 12px; border-radius: 20px; font-size: 0.9rem; cursor: pointer; display: flex; align-items: center; gap: 6px; z-index: 100; flex-shrink: 0; }
        .list-btn svg { width: 19px; height: 19px; }
        .list-btn span { background: #4cd964; color: #000; border-radius: 50%; padding: 2px 6px; font-size: 0.75rem; font-weight: bold; pointer-events: none; }

        .container { flex: 1; position: relative; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; background: #111; padding: 10px 15px 15px 15px; }
        
        /* Blocco centrale: quota 86px con margin-top: 76px e gap: 16px per interlinea uniformi a 16px */
        .main-block { width: 100%; max-width: 340px; display: flex; flex-direction: column; align-items: center; gap: 16px; margin-top: 76px; }

        /* Logo nella prima riga della fascia superiore */
        .app-title {
            width: 100%;
            max-width: 340px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(135deg, #292929, #181818);
            border: 2px solid #ffcc00;
            border-radius: 10px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.3);
            flex-shrink: 0;
        }
        .app-title-name { color: #ffcc00; font-size: 1.25rem; font-weight: 800; letter-spacing: 0.3px; }
        .app-title-version { color: #4cd964; font-size: 0.75rem; font-weight: bold; background: #303030; padding: 3px 7px; border-radius: 6px; }

        /* Contenitore per casella descrizione e tasto microfono vocale (v. 1.21/v. 1.22) */
        .description-container {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 30px);
            max-width: 340px;
            height: 60px;
            z-index: 10;
            display: flex;
            align-items: center;
        }

        .description-input {
            width: 100%;
            height: 100%;
            padding: 8px 50px 8px 12px;
            border: 4px solid #ffcc00;
            border-radius: 14px;
            background: #fff;
            color: #000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            font-size: clamp(1.2rem, 5vw, 1.7rem);
            font-weight: bold;
            text-align: center;
            outline: none;
        }
        .description-input:focus { border-color: #ffcc00; }
        /* v. 1.22: Dimensione del font del tip text leggermente aumentata per massima leggibilità */
        .description-input::placeholder { color: #777; font-size: clamp(0.95rem, 3.7vw, 1.12rem); font-weight: normal; opacity: 1; }

        /* Tasto microfono vocale schermata principale */
        .mic-btn {
            position: absolute;
            right: 8px;
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 10px;
            background: #2a2f3a;
            color: #ffcc00;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.25);
            transition: background-color 0.15s, transform 0.1s;
            flex-shrink: 0;
        }
        .mic-btn svg { width: 21px; height: 21px; }
        .mic-btn:active { transform: scale(0.92); }
        .mic-btn.listening {
            background: #ff3b30;
            color: #fff;
            animation: mic-pulse 1.2s infinite ease-in-out;
        }

        @keyframes mic-pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.6); }
            50% { transform: scale(1.08); box-shadow: 0 0 0 8px rgba(255, 59, 48, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 59, 48, 0); }
        }

        /* Riga unica Prezzo + Quantità + Frecce, in proporzione 3:1:1 */
        .price-qty-row { width: 100%; display: grid; grid-template-columns: 3fr 1fr 1fr; gap: 6px; height: 60px; }

        /* Display Prezzo */
        .price-display-box { min-width: 0; background: #fff; color: #000; border: 4px solid #ffcc00; border-radius: 14px; padding: 8px 10px; display: flex; justify-content: space-between; align-items: center; font-size: clamp(1.3rem, 6vw, 2rem); font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .price-display-box .currency { font-weight: normal; color: #333; }
        .price-display-box .value { letter-spacing: 1px; }

        /* Casella Quantità */
        .qty-input-box { min-width: 0; background: #fff; color: #000; border: 3px solid #ffcc00; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: clamp(1.2rem, 5vw, 1.6rem); font-weight: bold; }

        /* Frecce quantità */
        .qty-arrows-box { min-width: 0; background: #fff; border-radius: 10px; display: flex; flex-direction: column; border: 2px solid #ccc; overflow: hidden; }
        .arrow-btn { flex: 1; min-height: 0; background: #f0f0f0; border: none; font-size: 1rem; color: #000; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .arrow-btn:active { background: #ddd; }
        .arrow-btn:first-child { border-bottom: 1px solid #ccc; }

        /* Tasto AGGIUNGI */
        .add-btn { width: 100%; background: #2ecc71; color: #000; font-weight: bold; border: none; padding: 12px; border-radius: 12px; font-size: 1.4rem; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3); text-align: center; }
        .add-btn:active { transform: scale(0.98); background: #27ae60; }

        /* Tastierino Numerico Fisso: riga 4 con ',' e 'C' invertiti */
        .keypad { width: 100%; max-width: 340px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: auto; padding-bottom: 5px; }
        .key-btn { background: #2a2f3a; color: #fff; border: none; border-radius: 14px; padding: 12px 0; font-size: 1.5rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .key-btn:active { background: #3b4456; transform: scale(0.96); }
        .key-btn.backspace { background: #363b46; font-size: 1.3rem; }

        /* Toast centrato nello spazio tra AGGIUNGI e il tastierino */
        .toast {
            position: absolute;
            left: 50%;
            transform: translate(-50%, -50%);
            width: max-content;
            max-width: calc(100% - 24px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-align: center;
            background: rgba(18, 18, 18, 0.95);
            border: 1.5px solid #444;
            color: #4cd964;
            padding: 10px 22px;
            border-radius: 18px;
            z-index: 300;
            box-shadow: 0 6px 20px rgba(0,0,0,0.55);
            pointer-events: auto;
        }
        .toast.show { display: flex; }
        .toast-message { min-width: 0; overflow-wrap: anywhere; font-size: 1.25rem; font-weight: 800; color: #4cd964; line-height: 1.2; }
        .toast-undo-btn { flex-shrink: 0; border: 1.5px solid #4cd964; border-radius: 8px; padding: 5px 16px; background: #252525; color: #4cd964; font-size: 0.85rem; font-weight: 800; cursor: pointer; letter-spacing: 0.5px; }
        .toast-undo-btn:active { background: #4cd964; color: #000; }

        /* Lista a scomparsa e gestione carrello */
        .list-view { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #121212; z-index: 400; display: flex; flex-direction: column; transform: translateY(100%); transition: transform 0.3s ease; }
        .list-view.active { transform: translateY(0); }
        .list-header { padding: 18px 20px; background: #1f1f1f; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a2a2a; }
        .list-header h2 { font-size: 1.25rem; font-weight: 700; color: #ffcc00; display: flex; align-items: center; gap: 8px; }
        .list-header h2 svg { width: 22px; height: 22px; flex-shrink: 0; }
        
        .close-btn { background: none; border: none; color: #4cd964; font-size: 1rem; font-weight: bold; cursor: pointer; padding: 4px 8px; }
        .items-container { flex: 1; overflow-y: auto; padding: 15px; }
        
        .item-row { display: flex; flex-direction: column; background: #1f1f1f; padding: 12px 14px; border-radius: 10px; margin-bottom: 10px; gap: 9px; border: 1px solid #282828; }
        .item-top-row { width: 100%; display: flex; align-items: center; }
        .item-name { font-size: 1.12rem; font-weight: bold; color: #fff; width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; letter-spacing: 0.2px; }
        .item-bottom-row { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 6px; }
        
        .item-price-line { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
        .item-price-line span { font-size: 0.84rem; color: #bbb; white-space: nowrap; }
        .edit-price-btn { flex-shrink: 0; width: 24px; height: 24px; border: 1px solid #555; border-radius: 5px; background: #2d2d2d; color: #ffcc00; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
        .edit-price-btn svg { width: 13px; height: 13px; }
        
        .qty-controls { justify-self: center; display: flex; align-items: center; justify-content: center; gap: 6px; background: #2a2a2a; padding: 3px 6px; border-radius: 6px; }
        .qty-btn { background: #333; color: #fff; border: none; width: 26px; height: 26px; border-radius: 4px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.15rem; line-height: 1; }
        .qty-btn:active { background: #4cd964; color: #000; }
        .qty-val { font-weight: bold; min-width: 20px; text-align: center; color: #fff; font-size: 1rem; }
        
        .item-subtotal-actions { justify-self: end; display: flex; align-items: center; gap: 8px; }
        .item-subtotal { font-weight: 800; color: #4cd964; white-space: nowrap; font-size: 1.12rem; }
        
        .item-del-btn { background: rgba(255, 59, 48, 0.14); color: #ff453a; border: 1px solid rgba(255, 59, 48, 0.45); width: 26px; height: 26px; min-width: 26px; padding: 0; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .item-del-btn:active { background: #ff3b30; color: #fff; }
        .item-del-btn svg { width: 14px; height: 14px; }

        @media (max-width: 360px) {
            .items-container { padding: 10px; }
            .item-row { padding: 10px 11px; gap: 7px; }
            .item-name { font-size: 1.02rem; }
            .item-price-line span { font-size: 0.8rem; }
            .edit-price-btn { width: 22px; height: 22px; }
            .qty-controls { gap: 3px; padding: 2px 4px; }
            .qty-btn { width: 24px; height: 24px; font-size: 1rem; }
            .qty-val { min-width: 16px; font-size: 0.95rem; }
            .item-subtotal { font-size: 1.02rem; }
            .item-del-btn { width: 24px; height: 24px; min-width: 24px; }
            .item-del-btn svg { width: 13px; height: 13px; }
        }

        .list-footer { padding: 18px 20px; background: #1f1f1f; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #2a2a2a; }
        .clear-btn { background: #333; color: #ff3b30; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-size: 1rem; font-weight: bold; }
        .clear-btn:active { background: #444; }

        /* v. 1.22: Finestra per modificare descrizione e prezzo dell'articolo, allargata a max 375px */
        .edit-modal-backdrop { position: fixed; inset: 0; z-index: 500; display: none; align-items: flex-start; justify-content: center; padding: max(16px, env(safe-area-inset-top)) 16px 16px; background: rgba(0,0,0,0.78); }
        .edit-modal-backdrop.active { display: flex; }
        .edit-modal { width: 100%; max-width: 375px; max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px); overflow-y: auto; background: #1f1f1f; border: 1px solid #555; border-radius: 14px; padding: 20px 18px; box-shadow: 0 8px 28px rgba(0,0,0,0.55); }
        .edit-modal h2 { color: #ffcc00; font-size: 1.25rem; margin-bottom: 16px; }
        .edit-field { display: flex; flex-direction: column; gap: 7px; margin-top: 14px; }
        .edit-field label { color: #fff; font-size: 0.9rem; font-weight: bold; }
        .edit-field input { width: 100%; min-width: 0; padding: 11px 12px; border: 2px solid #ffcc00; border-radius: 8px; outline: none; background: #fff; color: #111; font-size: 1.15rem; font-weight: bold; }
        .edit-field input:focus { border-color: #4cd964; box-shadow: 0 0 0 2px rgba(76,217,100,0.18); }

        /* v. 1.22: Contenitore campo Descrizione con tasto vocale nel modal Modifica */
        .edit-desc-container {
            position: relative;
            width: 100%;
            display: flex;
            align-items: center;
        }

        .edit-desc-input {
            width: 100%;
            min-width: 0;
            padding: 11px 48px 11px 12px !important;
            border: 2px solid #ffcc00;
            border-radius: 8px;
            outline: none;
            background: #fff;
            color: #111;
            font-size: 1.15rem;
            font-weight: bold;
        }
        .edit-desc-input:focus { border-color: #4cd964; box-shadow: 0 0 0 2px rgba(76,217,100,0.18); }
        .edit-desc-input::placeholder { color: #777; font-size: 0.95rem; font-weight: normal; }

        .edit-mic-btn {
            position: absolute;
            right: 6px;
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 7px;
            background: #2a2f3a;
            color: #ffcc00;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.25);
            transition: background-color 0.15s, transform 0.1s;
            flex-shrink: 0;
        }
        .edit-mic-btn svg { width: 18px; height: 18px; }
        .edit-mic-btn:active { transform: scale(0.92); }
        .edit-mic-btn.listening {
            background: #ff3b30;
            color: #fff;
            animation: mic-pulse 1.2s infinite ease-in-out;
        }

        .edit-hint { color: #aaa; font-size: 0.75rem; }
        .edit-error { min-height: 0; margin-top: 10px; color: #ff6b63; font-size: 0.85rem; }
        .edit-modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
        .edit-modal-btn { border: none; border-radius: 8px; padding: 10px 15px; font-size: 0.95rem; font-weight: bold; cursor: pointer; }
        .edit-modal-btn.cancel { background: #333; color: #fff; }
        .edit-modal-btn.save { background: #2ecc71; color: #000; }
        .edit-modal-btn:active { transform: scale(0.98); }

        /* Finestra di conferma professionale in-app (senza "Questa pagina dice") */
        .confirm-modal-backdrop { position: fixed; inset: 0; z-index: 600; display: none; align-items: center; justify-content: center; padding: 20px; background: rgba(0,0,0,0.8); }
        .confirm-modal-backdrop.active { display: flex; }
        .confirm-modal { width: 100%; max-width: 320px; background: #222; border: 1.5px solid #444; border-radius: 16px; padding: 22px 20px 18px; box-shadow: 0 12px 35px rgba(0,0,0,0.7); display: flex; flex-direction: column; gap: 12px; text-align: center; }
        .confirm-modal h3 { font-size: 1.2rem; color: #ffcc00; font-weight: 700; }
        .confirm-modal p { font-size: 0.95rem; color: #ddd; line-height: 1.4; }
        .confirm-modal-actions { display: flex; gap: 10px; margin-top: 8px; }
        .confirm-modal-btn { flex: 1; border: none; border-radius: 10px; padding: 12px 0; font-size: 0.95rem; font-weight: bold; cursor: pointer; }
        .confirm-modal-btn.cancel { background: #3a3a3a; color: #fff; }
        .confirm-modal-btn.confirm-danger { background: #ff3b30; color: #fff; }
        .confirm-modal-btn:active { transform: scale(0.97); }
    </style>
</head>
<body>

    <header>
        <div class="header-title-row">
            <div class="app-title">
                <span class="app-title-name">PrestoSpesa</span>
                <span class="app-title-version">v. 1.22</span>
            </div>
        </div>
        <div class="header-stats-row">
            <div class="last-price">Ultimo<span id="lastPriceDisplay">0,00 €</span></div>
            <div class="total" id="totalDisplay">0,00 €</div>
            <button class="list-btn" id="openList" title="Apri carrello" aria-label="Apri carrello">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="8" cy="21" r="1"/>
                    <circle cx="19" cy="21" r="1"/>
                    <path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/>
                </svg>
                <span id="itemCount">0</span>
            </button>
        </div>
    </header>

    <div class="container">
        <!-- Toast -->
        <div class="toast" id="toast"></div>

        <!-- v. 1.21: Contenitore casella descrizione con comando vocale integrato -->
        <div class="description-container">
            <input
                class="description-input"
                id="descriptionInput"
                type="text"
                maxlength="25"
                autocomplete="off"
                autocapitalize="sentences"
                placeholder="Descrizione (max 25 caratteri)"
                aria-label="Descrizione dell'articolo, massimo 25 caratteri"
            >
            <button
                class="mic-btn"
                id="micBtn"
                type="button"
                title="Dettatura vocale descrizione"
                aria-label="Avvia dettatura vocale"
            >
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                    <line x1="12" y1="19" x2="12" y2="22"/>
                </svg>
            </button>
        </div>

        <!-- Blocco centrale -->
        <div class="main-block">
            <!-- Riga unica Prezzo + Quantità + Frecce -->
            <div class="price-qty-row">
                <div class="price-display-box">
                    <span class="currency">€</span>
                    <span class="value" id="priceDisplay">0,00</span>
                </div>

                <div class="qty-input-box" id="qtyDisplay">1</div>

                <div class="qty-arrows-box">
                    <button class="arrow-btn" id="qtyUp">▲</button>
                    <button class="arrow-btn" id="qtyDown">▼</button>
                </div>
            </div>

            <!-- Tasto AGGIUNGI -->
            <button class="add-btn" id="addBtn">AGGIUNGI</button>
        </div>

        <!-- Tastierino Numerico Fisso -->
        <div class="keypad">
            <button class="key-btn" data-key="1">1</button>
            <button class="key-btn" data-key="2">2</button>
            <button class="key-btn" data-key="3">3</button>
            <button class="key-btn" data-key="4">4</button>
            <button class="key-btn" data-key="5">5</button>
            <button class="key-btn" data-key="6">6</button>
            <button class="key-btn" data-key="7">7</button>
            <button class="key-btn" data-key="8">8</button>
            <button class="key-btn" data-key="9">9</button>
            <button class="key-btn" data-key=",">,</button>
            <button class="key-btn" data-key="0">0</button>
            <button class="key-btn backspace" data-key="back">C</button>
        </div>
    </div>

    <!-- Schermata Lista (Carrello) -->
    <div class="list-view" id="listView">
        <div class="list-header">
            <h2>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="8" cy="21" r="1"/>
                    <circle cx="19" cy="21" r="1"/>
                    <path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/>
                </svg>
                Carrello
            </h2>
            <button class="close-btn" id="closeList">Chiudi</button>
        </div>
        <div class="items-container" id="itemsContainer"></div>
        <div class="list-footer">
            <div style="font-size: 1.3rem; font-weight: bold; color: #4cd964;" id="listTotal">Tot: 0,00 €</div>
            <button class="clear-btn" id="clearBtn">Svuota</button>
        </div>
    </div>

    <!-- Finestra Modale Modifica Articolo (v. 1.22: con comando vocale) -->
    <div class="edit-modal-backdrop" id="editModal" aria-hidden="true">
        <form class="edit-modal" id="editItemForm" role="dialog" aria-modal="true" aria-labelledby="editModalTitle">
            <h2 id="editModalTitle">Modifica articolo</h2>
            <div class="edit-field">
                <label id="editDescriptionLabel" for="editDescriptionInput">Descrizione</label>
                <div class="edit-desc-container">
                    <input class="edit-desc-input" id="editDescriptionInput" type="text" maxlength="25" autocomplete="off">
                    <button class="edit-mic-btn" id="editMicBtn" type="button" title="Dettatura vocale descrizione" aria-label="Avvia dettatura vocale">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
                            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                            <line x1="12" y1="19" x2="12" y2="22"/>
                        </svg>
                    </button>
                </div>
                <span class="edit-hint">Fino a 25 caratteri.</span>
            </div>
            <div class="edit-field">
                <label id="editPriceLabel" for="editPriceInput">Prezzo</label>
                <input id="editPriceInput" type="text" inputmode="decimal" maxlength="9" autocomplete="off">
                <span class="edit-hint">Fino a 4 cifre intere e 2 decimali.</span>
            </div>
            <p class="edit-error" id="editError" role="alert"></p>
            <div class="edit-modal-actions">
                <button class="edit-modal-btn cancel" id="cancelEditBtn" type="button">Annulla</button>
                <button class="edit-modal-btn save" type="submit">Salva</button>
            </div>
        </form>
    </div>

    <!-- Finestra di conferma professionale in-app -->
    <div class="confirm-modal-backdrop" id="confirmModal" aria-hidden="true">
        <div class="confirm-modal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
            <h3 id="confirmTitle">Conferma</h3>
            <p id="confirmMessage"></p>
            <div class="confirm-modal-actions">
                <button class="confirm-modal-btn cancel" id="cancelConfirmBtn" type="button">Annulla</button>
                <button class="confirm-modal-btn confirm-danger" id="actionConfirmBtn" type="button">Conferma</button>
            </div>
        </div>
    </div>

    <script>
        const totalDisplay = document.getElementById('totalDisplay');
        const lastPriceDisplay = document.getElementById('lastPriceDisplay');
        const listTotal = document.getElementById('listTotal');
        const openList = document.getElementById('openList');
        const closeList = document.getElementById('closeList');
        const listView = document.getElementById('listView');
        const itemsContainer = document.getElementById('itemsContainer');
        const itemCount = document.getElementById('itemCount');
        const toast = document.getElementById('toast');
        const priceDisplay = document.getElementById('priceDisplay');
        const descriptionInput = document.getElementById('descriptionInput');
        const micBtn = document.getElementById('micBtn');
        const qtyDisplay = document.getElementById('qtyDisplay');
        const qtyUp = document.getElementById('qtyUp');
        const qtyDown = document.getElementById('qtyDown');
        const addBtn = document.getElementById('addBtn');
        const editModal = document.getElementById('editModal');
        const editItemForm = document.getElementById('editItemForm');
        const editDescriptionInput = document.getElementById('editDescriptionInput');
        const editMicBtn = document.getElementById('editMicBtn');
        const editPriceInput = document.getElementById('editPriceInput');
        const editError = document.getElementById('editError');
        const cancelEditBtn = document.getElementById('cancelEditBtn');
        
        // In-app confirm elements
        const confirmModal = document.getElementById('confirmModal');
        const confirmTitle = document.getElementById('confirmTitle');
        const confirmMessage = document.getElementById('confirmMessage');
        const cancelConfirmBtn = document.getElementById('cancelConfirmBtn');
        const actionConfirmBtn = document.getElementById('actionConfirmBtn');
        let onConfirmAction = null;

        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        cart = cart.map(item => ({ ...item, quantity: item.quantity || 1 }));

        let lastPrice = parseFloat(localStorage.getItem('lastPrice')) || 0;
        let currentInput = "0,00";
        let currentQty = 1;
        let toastTimeout = null;
        let editingItemId = null;
        let editingDefaultLabel = null;

        // v. 1.21 & v. 1.22: Riconoscimento vocale
        let isListening = false;
        let recognition = null;
        let isListeningEdit = false;
        let recognitionEdit = null;
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;

        function cleanTranscript(raw) {
            if (!raw) return '';
            let cleaned = raw.trim().replace(/[.,;:!?]+$/, '');
            if (cleaned.length > 0) {
                cleaned = cleaned.charAt(0).toUpperCase() + cleaned.slice(1);
            }
            return cleaned.slice(0, 25);
        }

        // Tasto vocale nella schermata principale
        if (micBtn) {
            micBtn.addEventListener('click', () => {
                if (!SpeechRec) {
                    showToast('Riconoscimento vocale non supportato dal browser');
                    return;
                }

                if (isListening) {
                    if (recognition) {
                        try { recognition.stop(); } catch(e) {}
                    }
                    stopListeningUI();
                    return;
                }

                try {
                    recognition = new SpeechRec();
                    recognition.lang = 'it-IT';
                    recognition.continuous = false;
                    recognition.interimResults = false;
                    recognition.maxAlternatives = 1;

                    recognition.onstart = () => {
                        isListening = true;
                        micBtn.classList.add('listening');
                        descriptionInput.placeholder = 'Parla ora...';
                    };

                    recognition.onresult = (event) => {
                        const raw = event.results && event.results[0] && event.results[0][0] && event.results[0][0].transcript;
                        if (raw) {
                            descriptionInput.value = cleanTranscript(raw);
                        }
                    };

                    recognition.onerror = (event) => {
                        stopListeningUI();
                        if (event.error !== 'no-speech' && event.error !== 'aborted') {
                            showToast('Errore nel comando vocale');
                        }
                    };

                    recognition.onend = () => {
                        stopListeningUI();
                    };

                    recognition.start();
                } catch(e) {
                    stopListeningUI();
                    showToast('Impossibile avviare il microfono');
                }
            });
        }

        function stopListeningUI() {
            isListening = false;
            if (micBtn) micBtn.classList.remove('listening');
            if (descriptionInput) descriptionInput.placeholder = 'Descrizione (max 25 caratteri)';
        }

        // v. 1.22: Tasto vocale nella finestra Modifica Articolo
        if (editMicBtn) {
            editMicBtn.addEventListener('click', () => {
                if (!SpeechRec) {
                    showToast('Riconoscimento vocale non supportato dal browser');
                    return;
                }

                if (isListeningEdit) {
                    if (recognitionEdit) {
                        try { recognitionEdit.stop(); } catch(e) {}
                    }
                    stopListeningEditUI();
                    return;
                }

                try {
                    recognitionEdit = new SpeechRec();
                    recognitionEdit.lang = 'it-IT';
                    recognitionEdit.continuous = false;
                    recognitionEdit.interimResults = false;
                    recognitionEdit.maxAlternatives = 1;

                    recognitionEdit.onstart = () => {
                        isListeningEdit = true;
                        editMicBtn.classList.add('listening');
                        editDescriptionInput.placeholder = 'Parla ora...';
                    };

                    recognitionEdit.onresult = (event) => {
                        const raw = event.results && event.results[0] && event.results[0][0] && event.results[0][0].transcript;
                        if (raw) {
                            // Sostituisce direttamente la descrizione pre-esistente
                            editDescriptionInput.value = cleanTranscript(raw);
                            editingDefaultLabel = null;
                        }
                    };

                    recognitionEdit.onerror = (event) => {
                        stopListeningEditUI();
                        if (event.error !== 'no-speech' && event.error !== 'aborted') {
                            showToast('Errore nel comando vocale');
                        }
                    };

                    recognitionEdit.onend = () => {
                        stopListeningEditUI();
                    };

                    recognitionEdit.start();
                } catch(e) {
                    stopListeningEditUI();
                    showToast('Impossibile avviare il microfono');
                }
            });
        }

        function stopListeningEditUI() {
            isListeningEdit = false;
            if (editMicBtn) editMicBtn.classList.remove('listening');
            if (editDescriptionInput) editDescriptionInput.placeholder = '';
        }

        updateUI();

        document.querySelectorAll('.key-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                descriptionInput.blur();
                const key = btn.getAttribute('data-key');

                if (key === 'back') {
                    if (currentInput !== "0,00") {
                        const lastDigitIndex = currentInput.search(/\d(?=\D*$)/);
                        if (lastDigitIndex !== -1) {
                            currentInput = currentInput.slice(0, lastDigitIndex) + currentInput.slice(lastDigitIndex + 1);
                        }
                        if (!/\d/.test(currentInput)) {
                            currentInput = "0,00";
                        }
                    }
                } else if (key === ',') {
                    if (!currentInput.includes(',')) {
                        currentInput += ',';
                    }
                } else {
                    if (currentInput === "0,00") {
                        currentInput = key;
                    } else if (currentInput.includes(',')) {
                        const decimalPart = currentInput.split(',')[1];
                        if (decimalPart.length < 2) {
                            currentInput += key;
                        }
                    } else {
                        const integerDigits = currentInput.replace(/\D/g, '').length;
                        if (integerDigits < 4) {
                            currentInput += key;
                        }
                    }
                }
                formatDisplayInput();
            });
        });

        function formatNumberWithThousands(numStr) {
            if (numStr === "0,00") return "0,00";
            const parts = numStr.split(',');
            const intFormatted = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
            return parts.length > 1 ? `${intFormatted},${parts[1]}` : intFormatted;
        }

        function formatDisplayInput() {
            priceDisplay.innerText = formatNumberWithThousands(currentInput);
        }

        function formatCurrency(val) {
            const fixed = (Number.isFinite(val) ? val : 0).toFixed(2);
            const [intPart, decPart] = fixed.split('.');
            const intFormatted = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
            return `${intFormatted},${decPart} €`;
        }

        qtyUp.addEventListener('click', () => {
            currentQty++;
            qtyDisplay.innerText = currentQty;
        });

        qtyDown.addEventListener('click', () => {
            if (currentQty > 1) {
                currentQty--;
                qtyDisplay.innerText = currentQty;
            }
        });

        addBtn.addEventListener('click', () => {
            const cleanStr = currentInput.replace(/\./g, '').replace(',', '.');
            let numericVal = parseFloat(cleanStr);
            if (isNaN(numericVal) || numericVal <= 0) {
                showToast("Inserisci un prezzo valido");
                return;
            }

            const description = descriptionInput.value.trim().slice(0, 25);
            const addedItem = { id: Date.now(), price: numericVal, quantity: currentQty, description };
            cart.unshift(addedItem);
            lastPrice = numericVal;
            saveAndRender();
            showToast(`Aggiunto: ${formatCurrency(numericVal)} (x${currentQty})`, () => {
                const addedIndex = cart.findIndex(item => item.id === addedItem.id);
                if (addedIndex === -1) return false;
                cart.splice(addedIndex, 1);
                lastPrice = cart.length > 0 ? cart[0].price : 0;
                saveAndRender();
                return true;
            });

            currentInput = "0,00";
            currentQty = 1;
            qtyDisplay.innerText = "1";
            descriptionInput.value = "";
            formatDisplayInput();
        });

        function saveAndRender() {
            localStorage.setItem('cart', JSON.stringify(cart));
            localStorage.setItem('lastPrice', lastPrice);
            updateUI();
        }

        function updateUI() {
            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const totalItemsCount = cart.reduce((sum, item) => sum + item.quantity, 0);
            const formattedTotal = formatCurrency(total);
            const formattedLast = formatCurrency(lastPrice);

            totalDisplay.innerText = formattedTotal;
            lastPriceDisplay.innerText = formattedLast;
            listTotal.innerText = "Tot: " + formattedTotal;
            itemCount.innerText = totalItemsCount;

            itemsContainer.innerHTML = cart.length === 0 ? '<p style="text-align:center; color:#777; margin-top:30px;">Carrello vuoto</p>' : '';
            
            cart.forEach((item, index) => {
                const subtotal = formatCurrency(item.price * item.quantity);
                const unitPrice = formatCurrency(item.price);
                const row = document.createElement('div');
                row.className = 'item-row';
                const displayDescription = item.description && item.description.trim()
                    ? item.description.trim()
                    : `Art. ${cart.length - index}`;
                
                row.innerHTML = `
                    <div class="item-top-row">
                        <strong class="item-name" title="${escapeHtml(displayDescription)}">${escapeHtml(displayDescription)}</strong>
                    </div>
                    <div class="item-bottom-row">
                        <div class="item-price-line">
                            <span>${unitPrice} cad.</span>
                            <button class="edit-price-btn" type="button" onclick="editItem(${item.id})" aria-label="Modifica articolo ${cart.length - index}" title="Modifica descrizione e prezzo">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M12 20h9"/>
                                    <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/>
                                </svg>
                            </button>
                        </div>
                        <div class="qty-controls">
                            <button class="qty-btn" onclick="changeQty(${item.id}, -1)" aria-label="Diminuisci quantità">−</button>
                            <span class="qty-val">${item.quantity}</span>
                            <button class="qty-btn" onclick="changeQty(${item.id}, 1)" aria-label="Aumenta quantità">+</button>
                        </div>
                        <div class="item-subtotal-actions">
                            <div class="item-subtotal">${subtotal}</div>
                            <button class="item-del-btn" type="button" onclick="confirmRemove(${item.id})" aria-label="Elimina articolo" title="Elimina articolo">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <line x1="18" y1="6" x2="6" y2="18"></line>
                                    <line x1="6" y1="6" x2="18" y2="18"></line>
                                </svg>
                            </button>
                        </div>
                    </div>
                `;
                itemsContainer.appendChild(row);
            });
        }

        window.changeQty = function(id, delta) {
            const item = cart.find(i => i.id === id);
            if (item) {
                item.quantity += delta;
                if (item.quantity < 1) {
                    item.quantity = 1;
                }
                saveAndRender();
            }
        }

        function escapeHtml(value) {
            return String(value).replace(/[&<>"']/g, character => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            })[character]);
        }

        window.editItem = function(id) {
            const item = cart.find(i => i.id === id);
            if (!item) return;

            const articleIndex = cart.findIndex(i => i.id === id);
            const articleNumber = cart.length - articleIndex;
            const articleLabel = `Art. ${articleNumber}`;

            editingItemId = id;
            editDescriptionInput.placeholder = '';
            editPriceInput.placeholder = '';

            const hasCustomDescription = Boolean(item.description && item.description.trim());
            editingDefaultLabel = hasCustomDescription ? null : articleLabel;
            editDescriptionInput.value = hasCustomDescription ? item.description.trim() : articleLabel;

            const fixed = item.price.toFixed(2);
            const [intP, decP] = fixed.split('.');
            const formattedInt = intP.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
            editPriceInput.value = `${formattedInt},${decP}`;

            editError.textContent = '';
            editModal.classList.add('active');
            editModal.setAttribute('aria-hidden', 'false');
            editDescriptionInput.focus({ preventScroll: true });
            const cursorEnd = editDescriptionInput.value.length;
            editDescriptionInput.setSelectionRange(cursorEnd, cursorEnd);
        };

        function closeEditModal() {
            if (recognitionEdit) {
                try { recognitionEdit.stop(); } catch(e) {}
            }
            stopListeningEditUI();
            editModal.classList.remove('active');
            editModal.setAttribute('aria-hidden', 'true');
            editItemForm.reset();
            editError.textContent = '';
            editingItemId = null;
            editingDefaultLabel = null;
        }

        cancelEditBtn.addEventListener('click', closeEditModal);

        editModal.addEventListener('click', event => {
            if (event.target === editModal) closeEditModal();
        });

        document.addEventListener('keydown', event => {
            if (event.key === 'Escape') {
                if (editModal.classList.contains('active')) closeEditModal();
                if (confirmModal.classList.contains('active')) closeConfirmModal();
            }
        });

        editItemForm.addEventListener('submit', event => {
            event.preventDefault();
            const item = cart.find(i => i.id === editingItemId);
            if (!item) {
                closeEditModal();
                return;
            }

            const enteredDescription = editDescriptionInput.value.trim();
            const enteredPrice = editPriceInput.value.trim();

            if (enteredDescription.length > 25) {
                editError.textContent = 'La descrizione può contenere al massimo 25 caratteri.';
                editDescriptionInput.focus();
                return;
            }

            const normalizedPrice = enteredPrice.replace(/\./g, '');
            if (!/^\d{1,4}(?:[.,]\d{1,2})?$/.test(normalizedPrice)) {
                editError.textContent = 'Prezzo non valido: usa fino a 4 cifre intere e 2 decimali, ad esempio 1.250,00 o 12,50.';
                editPriceInput.focus();
                return;
            }

            const newPrice = Number(normalizedPrice.replace(',', '.'));
            if (!Number.isFinite(newPrice) || newPrice <= 0) {
                editError.textContent = 'Il prezzo deve essere maggiore di zero.';
                editPriceInput.focus();
                return;
            }

            item.description = editingDefaultLabel && enteredDescription === editingDefaultLabel
                ? ''
                : enteredDescription;
            item.price = newPrice;
            if (cart[0] && cart[0].id === item.id) {
                lastPrice = newPrice;
            }

            closeEditModal();
            saveAndRender();
            showToast('Articolo aggiornato', null, 2000);
        });

        function showInAppConfirm(title, message, confirmBtnLabel, onConfirm) {
            confirmTitle.textContent = title;
            confirmMessage.textContent = message;
            actionConfirmBtn.textContent = confirmBtnLabel;
            onConfirmAction = onConfirm;
            confirmModal.classList.add('active');
            confirmModal.setAttribute('aria-hidden', 'false');
        }

        function closeConfirmModal() {
            confirmModal.classList.remove('active');
            confirmModal.setAttribute('aria-hidden', 'true');
            onConfirmAction = null;
        }

        cancelConfirmBtn.addEventListener('click', closeConfirmModal);
        actionConfirmBtn.addEventListener('click', () => {
            if (typeof onConfirmAction === 'function') {
                onConfirmAction();
            }
            closeConfirmModal();
        });
        confirmModal.addEventListener('click', (e) => {
            if (e.target === confirmModal) closeConfirmModal();
        });

        window.confirmRemove = function(id) {
            const item = cart.find(i => i.id === id);
            const name = item && item.description && item.description.trim() ? item.description.trim() : 'questo articolo';
            showInAppConfirm('Elimina articolo', `Vuoi rimuovere "${name}" dal carrello?`, 'Elimina', () => {
                const wasLatest = cart[0] && cart[0].id === id;
                cart = cart.filter(i => i.id !== id);
                if (cart.length === 0) {
                    lastPrice = 0;
                } else if (wasLatest) {
                    lastPrice = cart[0].price;
                }
                saveAndRender();
            });
        };

        openList.addEventListener('click', (e) => {
            e.preventDefault();
            listView.classList.add('active');
        });

        closeList.addEventListener('click', (e) => {
            e.preventDefault();
            listView.classList.remove('active');
        });

        document.getElementById('clearBtn').addEventListener('click', (e) => {
            e.preventDefault();
            showInAppConfirm('Svuota carrello', 'Sei sicuro di voler svuotare interamente il carrello?', 'Svuota', () => {
                cart = [];
                lastPrice = 0;
                saveAndRender();
            });
        });
        
        function positionToast() {
            const container = document.querySelector('.container');
            const keypad = document.querySelector('.keypad');
            const addRect = addBtn.getBoundingClientRect();
            const keypadRect = keypad.getBoundingClientRect();
            const containerRect = container.getBoundingClientRect();
            const midpoint = (addRect.bottom + keypadRect.top) / 2;
            toast.style.top = `${midpoint - containerRect.top}px`;
        }

        function showToast(msg, onUndo = null, duration = 4000) {
            if (toastTimeout) clearTimeout(toastTimeout);
            toast.replaceChildren();

            const message = document.createElement('div');
            message.className = 'toast-message';
            message.textContent = msg;
            toast.appendChild(message);

            if (typeof onUndo === 'function') {
                const undoButton = document.createElement('button');
                undoButton.type = 'button';
                undoButton.className = 'toast-undo-btn';
                undoButton.textContent = 'ANNULLA';
                undoButton.addEventListener('click', () => {
                    if (toastTimeout) clearTimeout(toastTimeout);
                    const undone = onUndo();
                    toast.replaceChildren();
                    const feedback = document.createElement('div');
                    feedback.className = 'toast-message';
                    feedback.textContent = undone ? 'Inserimento annullato' : 'Articolo non più presente';
                    toast.appendChild(feedback);
                    toast.classList.add('show');
                    positionToast();
                    toastTimeout = setTimeout(() => toast.classList.remove('show'), 1800);
                });
                toast.appendChild(undoButton);
            }

            toast.classList.add('show');
            positionToast();
            toastTimeout = setTimeout(() => toast.classList.remove('show'), duration);
        }
    </script>
</body>
</html>
