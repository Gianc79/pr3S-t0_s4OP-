<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PrestoSpesa v. 1.14</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        html, body { width: 100%; height: 100%; background: #000; color: #fff; overflow: hidden; position: fixed; top: 0; left: 0; display: flex; flex-direction: column; }
        
        /* Fascia superiore fissa, su due righe */
        header { background: #1f1f1f; padding: 7px 15px 9px; display: flex; flex-direction: column; align-items: center; gap: 7px; border-bottom: 1px solid #333; z-index: 100; flex-shrink: 0; width: 100%; }
        .header-title-row { width: 100%; display: flex; justify-content: center; }
        .header-stats-row { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .last-price { font-size: 0.85rem; color: #aaa; display: flex; flex-direction: column; flex-shrink: 0; }
        .last-price span { font-size: 1.1rem; font-weight: bold; color: #4cd964; }
        .total { font-size: 1.6rem; font-weight: bold; color: #fff; text-align: center; flex: 1; min-width: 0; }
        .list-btn { background: #333; color: #fff; border: none; padding: 8px 14px; border-radius: 20px; font-size: 0.9rem; cursor: pointer; display: flex; align-items: center; gap: 5px; z-index: 100; flex-shrink: 0; }
        .list-btn span { background: #4cd964; color: #000; border-radius: 50%; padding: 2px 5px; font-size: 0.75rem; font-weight: bold; pointer-events: none; }

        .container { flex: 1; position: relative; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; background: #111; padding: 10px 15px 15px 15px; }
        
        /* Blocco centrale */
        .main-block { width: 100%; max-width: 340px; display: flex; flex-direction: column; align-items: center; gap: 12px; margin-top: 80px; }

        /* Logo nella prima riga della fascia superiore */
        .app-title {
            width: 100%;
            max-width: 340px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(135deg, #292929, #181818);
            border: 2px solid #ffcc00;
            border-radius: 10px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.3);
            flex-shrink: 0;
        }
        .app-title-name { color: #ffcc00; font-size: 1.25rem; font-weight: 800; letter-spacing: 0.3px; }
        .app-title-version { color: #4cd964; font-size: 0.75rem; font-weight: bold; background: #303030; padding: 3px 7px; border-radius: 6px; }

        /* Casella descrizione, nello spazio prima occupato dal logo */
        .description-input {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 30px);
            max-width: 340px;
            height: 60px;
            padding: 8px 12px;
            border: 4px solid #ffcc00;
            border-radius: 14px;
            background: #fff;
            color: #000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            font-size: clamp(1rem, 4.5vw, 1.3rem);
            font-weight: bold;
            text-align: center;
            outline: none;
            z-index: 1;
        }
        .description-input:focus { border-color: #ffcc00; }
        .description-input::placeholder { color: #777; font-size: clamp(0.8rem, 3.7vw, 1rem); font-weight: normal; opacity: 1; }

        /* Riga unica Prezzo + Quantità + Frecce, in proporzione 3:1:1 */
        .price-qty-row { width: 100%; display: grid; grid-template-columns: 3fr 1fr 1fr; gap: 6px; height: 60px; }

        /* Display Prezzo */
        .price-display-box { min-width: 0; background: #fff; color: #000; border: 4px solid #ffcc00; border-radius: 14px; padding: 8px 10px; display: flex; justify-content: space-between; align-items: center; font-size: clamp(1.3rem, 6vw, 2rem); font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .price-display-box .currency { font-weight: normal; color: #333; }
        .price-display-box .value { letter-spacing: 1px; }

        /* Casella Quantità */
        .qty-input-box { min-width: 0; background: #fff; color: #000; border: 3px solid #ffcc00; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: clamp(1.2rem, 5vw, 1.6rem); font-weight: bold; }

        /* Frecce quantità */
        .qty-arrows-box { min-width: 0; background: #fff; border-radius: 10px; display: flex; flex-direction: column; border: 2px solid #ccc; overflow: hidden; }
        .arrow-btn { flex: 1; min-height: 0; background: #f0f0f0; border: none; font-size: 1rem; color: #000; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .arrow-btn:active { background: #ddd; }
        .arrow-btn:first-child { border-bottom: 1px solid #ccc; }

        /* Tasto AGGIUNGI */
        .add-btn { width: 100%; background: #2ecc71; color: #000; font-weight: bold; border: none; padding: 12px; border-radius: 12px; font-size: 1.4rem; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3); text-align: center; }
        .add-btn:active { transform: scale(0.98); background: #27ae60; }

        /* Tastierino Numerico Fisso */
        .keypad { width: 100%; max-width: 340px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: auto; padding-bottom: 5px; }
        .key-btn { background: #2a2f3a; color: #fff; border: none; border-radius: 14px; padding: 12px 0; font-size: 1.5rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .key-btn:active { background: #3b4456; transform: scale(0.96); }
        .key-btn.backspace { background: #363b46; font-size: 1.3rem; }

        /* Lista a scomparsa e gestione quantità */
        .list-view { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #121212; z-index: 200; display: flex; flex-direction: column; transform: translateY(100%); transition: transform 0.3s ease; }
        .list-view.active { transform: translateY(0); }
        .list-header { padding: 20px; background: #1f1f1f; display: flex; justify-content: space-between; align-items: center; }
        .close-btn { background: none; border: none; color: #4cd964; font-size: 1rem; font-weight: bold; cursor: pointer; }
        .items-container { flex: 1; overflow-y: auto; padding: 15px; }
        
        .item-row { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; background: #1f1f1f; padding: 10px; border-radius: 8px; margin-bottom: 10px; gap: 8px; font-size: 0.9rem; }
        .item-info { min-width: 0; line-height: 1.3; }
        .item-info strong { display: block; margin-bottom: 3px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .item-price-line { display: flex; align-items: center; gap: 5px; min-width: 0; }
        .item-price-line span { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .edit-price-btn { flex-shrink: 0; width: 24px; height: 24px; border: 1px solid #555; border-radius: 5px; background: #303030; color: #ffcc00; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
        .edit-price-btn svg { width: 14px; height: 14px; }
        .qty-controls { justify-self: center; display: flex; align-items: center; justify-content: center; gap: 5px; background: #2a2a2a; padding: 4px 6px; border-radius: 6px; }
        .qty-btn { background: #333; color: #fff; border: none; width: 26px; height: 28px; border-radius: 4px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; }
        .qty-btn:active { background: #4cd964; color: #000; }
        .qty-val { font-weight: bold; min-width: 20px; text-align: center; }
        .item-actions { display: grid; grid-template-columns: minmax(0, 1fr) 34px; align-items: center; gap: 5px; min-width: 0; }
        .item-subtotal { font-weight: bold; color: #4cd964; min-width: 0; max-width: 100%; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 0.9rem; }
        .del-btn { background: #ff3b30; color: #fff; border: none; width: 34px; height: 34px; min-width: 34px; padding: 0; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .del-btn svg { width: 19px; height: 19px; }

        @media (max-width: 360px) {
            .items-container { padding: 10px; }
            .item-row { grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); padding: 8px; gap: 5px; }
            .item-price-line { gap: 3px; }
            .item-price-line span { font-size: 0.78rem; white-space: nowrap; }
            .edit-price-btn { width: 22px; height: 22px; }
            .qty-controls { gap: 2px; padding: 3px; }
            .qty-btn { width: 24px; height: 28px; }
            .qty-val { min-width: 15px; }
            .item-actions { grid-template-columns: minmax(0, 1fr) 30px; gap: 3px; }
            .item-subtotal { font-size: 0.76rem; }
            .del-btn { width: 30px; height: 30px; min-width: 30px; }
        }
        


        /* Finestra per modificare descrizione e prezzo dell'articolo */
        .edit-modal-backdrop { position: fixed; inset: 0; z-index: 500; display: none; align-items: center; justify-content: center; padding: 16px; background: rgba(0,0,0,0.78); }
        .edit-modal-backdrop.active { display: flex; }
        .edit-modal { width: 100%; max-width: 360px; max-height: 88vh; overflow-y: auto; background: #1f1f1f; border: 1px solid #555; border-radius: 14px; padding: 18px; box-shadow: 0 8px 28px rgba(0,0,0,0.55); }
        .edit-modal h2 { color: #ffcc00; font-size: 1.2rem; margin-bottom: 16px; }
        .edit-field { display: flex; flex-direction: column; gap: 7px; margin-top: 13px; }
        .edit-field label { color: #fff; font-size: 0.9rem; font-weight: bold; }
        .edit-field input { width: 100%; min-width: 0; padding: 11px 12px; border: 2px solid #ffcc00; border-radius: 8px; outline: none; background: #fff; color: #111; font-size: 1rem; }
        .edit-field input:focus { border-color: #4cd964; box-shadow: 0 0 0 2px rgba(76,217,100,0.18); }
        .edit-hint { color: #aaa; font-size: 0.75rem; }
        .edit-error { min-height: 0; margin-top: 10px; color: #ff6b63; font-size: 0.85rem; }
        .edit-modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
        .edit-modal-btn { border: none; border-radius: 8px; padding: 10px 13px; font-size: 0.95rem; font-weight: bold; cursor: pointer; }
        .edit-modal-btn.cancel { background: #333; color: #fff; }
        .edit-modal-btn.save { background: #2ecc71; color: #000; }
        .edit-modal-btn:active { transform: scale(0.98); }

        .list-footer { padding: 20px; background: #1f1f1f; display: flex; justify-content: space-between; align-items: center; }
        .clear-btn { background: #333; color: #ff3b30; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-size: 1rem; font-weight: bold; }

        /* Toast centrato nello spazio tra AGGIUNGI e il tastierino */
        .toast { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: max-content; max-width: calc(100% - 20px); display: none; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; text-align: center; line-height: 1.2; background: rgba(0,0,0,0.9); border: 1px solid #444; color: #4cd964; padding: 8px 16px; border-radius: 20px; z-index: 300; font-size: 1.4rem; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.4); pointer-events: auto; }
        .toast.show { display: flex; }
        .toast-message { min-width: 0; overflow-wrap: anywhere; }
        .toast-undo-btn { flex-shrink: 0; border: 1px solid #4cd964; border-radius: 8px; padding: 6px 9px; background: #252525; color: #4cd964; font-size: 0.85rem; font-weight: 800; cursor: pointer; }
        .toast-undo-btn:active { background: #4cd964; color: #000; }
    </style>
</head>
<body>

    <header>
        <div class="header-title-row">
            <div class="app-title">
                <span class="app-title-name">PrestoSpesa</span>
                <span class="app-title-version">v. 1.14</span>
            </div>
        </div>
        <div class="header-stats-row">
            <div class="last-price">Ultimo<span id="lastPriceDisplay">0,00 €</span></div>
            <div class="total" id="totalDisplay">0,00 €</div>
            <button class="list-btn" id="openList">Lista <span id="itemCount">0</span></button>
        </div>
    </header>

    <div class="container">
        <!-- Toast -->
        <div class="toast" id="toast">Prezzo aggiunto</div>

        <!-- Descrizione facoltativa dell'articolo da inserire -->
        <input
            class="description-input"
            id="descriptionInput"
            type="text"
            maxlength="14"
            autocomplete="off"
            autocapitalize="sentences"
            placeholder="Descrizione (max 14 caratteri)"
            aria-label="Descrizione dell'articolo, massimo 14 caratteri"
        >

        <!-- Blocco centrale -->
        <div class="main-block">
            <!-- Riga unica Prezzo + Quantità + Frecce -->
            <div class="price-qty-row">
                <div class="price-display-box">
                    <span class="currency">€</span>
                    <span class="value" id="priceDisplay">0,00</span>
                </div>

                <div class="qty-input-box" id="qtyDisplay">1</div>

                <div class="qty-arrows-box">
                    <button class="arrow-btn" id="qtyUp">▲</button>
                    <button class="arrow-btn" id="qtyDown">▼</button>
                </div>
            </div>

            <!-- Tasto AGGIUNGI -->
            <button class="add-btn" id="addBtn">AGGIUNGI</button>
        </div>

        <!-- Tastierino Numerico Fisso -->
        <div class="keypad">
            <button class="key-btn" data-key="1">1</button>
            <button class="key-btn" data-key="2">2</button>
            <button class="key-btn" data-key="3">3</button>
            <button class="key-btn" data-key="4">4</button>
            <button class="key-btn" data-key="5">5</button>
            <button class="key-btn" data-key="6">6</button>
            <button class="key-btn" data-key="7">7</button>
            <button class="key-btn" data-key="8">8</button>
            <button class="key-btn" data-key="9">9</button>
            <button class="key-btn backspace" data-key="back">C</button>
            <button class="key-btn" data-key="0">0</button>
            <button class="key-btn" data-key=",">,</button>
        </div>
    </div>

    <div class="list-view" id="listView">
        <div class="list-header">
            <h2>Carrello</h2>
            <button class="close-btn" id="closeList">Chiudi</button>
        </div>
        <div class="items-container" id="itemsContainer"></div>
        <div class="list-footer">
            <div style="font-size: 1.3rem; font-weight: bold; color: #4cd964;" id="listTotal">Tot: 0,00 €</div>
            <button class="clear-btn" id="clearBtn">Svuota</button>
        </div>
    </div>

    <div class="edit-modal-backdrop" id="editModal" aria-hidden="true">
        <form class="edit-modal" id="editItemForm" role="dialog" aria-modal="true" aria-labelledby="editModalTitle">
            <h2 id="editModalTitle">Modifica articolo</h2>
            <div class="edit-field">
                <label id="editDescriptionLabel" for="editDescriptionInput">Nuova descrizione per Art. 1</label>
                <input id="editDescriptionInput" type="text" maxlength="14" autocomplete="off" placeholder="Lascia vuoto per Art. 1">
                <span class="edit-hint">Fino a 14 caratteri.</span>
            </div>
            <div class="edit-field">
                <label id="editPriceLabel" for="editPriceInput">Nuovo prezzo per Art. 1</label>
                <input id="editPriceInput" type="text" inputmode="decimal" maxlength="9" autocomplete="off" required placeholder="Es. 12,50">
                <span class="edit-hint">Fino a 6 cifre intere e 2 decimali.</span>
            </div>
            <p class="edit-error" id="editError" role="alert"></p>
            <div class="edit-modal-actions">
                <button class="edit-modal-btn cancel" id="cancelEditBtn" type="button">Annulla</button>
                <button class="edit-modal-btn save" type="submit">Salva</button>
            </div>
        </form>
    </div>

    <script>
        const totalDisplay = document.getElementById('totalDisplay');
        const lastPriceDisplay = document.getElementById('lastPriceDisplay');
        const listTotal = document.getElementById('listTotal');
        const openList = document.getElementById('openList');
        const closeList = document.getElementById('closeList');
        const listView = document.getElementById('listView');
        const itemsContainer = document.getElementById('itemsContainer');
        const itemCount = document.getElementById('itemCount');
        const toast = document.getElementById('toast');
        const priceDisplay = document.getElementById('priceDisplay');
        const descriptionInput = document.getElementById('descriptionInput');
        const qtyDisplay = document.getElementById('qtyDisplay');
        const qtyUp = document.getElementById('qtyUp');
        const qtyDown = document.getElementById('qtyDown');
        const addBtn = document.getElementById('addBtn');
        const editModal = document.getElementById('editModal');
        const editItemForm = document.getElementById('editItemForm');
        const editDescriptionInput = document.getElementById('editDescriptionInput');
        const editPriceInput = document.getElementById('editPriceInput');
        const editDescriptionLabel = document.getElementById('editDescriptionLabel');
        const editPriceLabel = document.getElementById('editPriceLabel');
        const editError = document.getElementById('editError');
        const cancelEditBtn = document.getElementById('cancelEditBtn');

        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        cart = cart.map(item => ({ ...item, quantity: item.quantity || 1 }));

        let lastPrice = parseFloat(localStorage.getItem('lastPrice')) || 0;
        let currentInput = "0,00";
        let currentQty = 1;
        let toastTimeout = null;
        let editingItemId = null;

        updateUI();

        document.querySelectorAll('.key-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                // Se il campo descrizione era attivo, chiude la tastiera virtuale
                // quando si torna al tastierino numerico dell'app.
                descriptionInput.blur();
                const key = btn.getAttribute('data-key');

                if (key === 'back') {
                    // Elimina una cifra per pressione, senza azzerare subito il prezzo.
                    if (currentInput !== "0,00") {
                        const lastDigitIndex = currentInput.search(/\d(?=\D*$)/);
                        if (lastDigitIndex !== -1) {
                            currentInput = currentInput.slice(0, lastDigitIndex) + currentInput.slice(lastDigitIndex + 1);
                        }
                        if (!/\d/.test(currentInput)) {
                            currentInput = "0,00";
                        }
                    }
                } else if (key === ',') {
                    if (!currentInput.includes(',')) {
                        currentInput += ',';
                    }
                } else {
                    if (currentInput === "0,00") {
                        currentInput = key;
                    } else if (currentInput.includes(',')) {
                        const decimalPart = currentInput.split(',')[1];
                        if (decimalPart.length < 2) {
                            currentInput += key;
                        }
                    } else {
                        const integerDigits = currentInput.replace(/\D/g, '').length;
                        if (integerDigits < 6) {
                            currentInput += key;
                        }
                    }
                }
                formatDisplayInput();
            });
        });

        function formatDisplayInput() {
            let clean = currentInput.replace('.', ',');
            priceDisplay.innerText = clean;
        }

        qtyUp.addEventListener('click', () => {
            currentQty++;
            qtyDisplay.innerText = currentQty;
        });

        qtyDown.addEventListener('click', () => {
            if (currentQty > 1) {
                currentQty--;
                qtyDisplay.innerText = currentQty;
            }
        });

        addBtn.addEventListener('click', () => {
            let numericVal = parseFloat(currentInput.replace(',', '.'));
            if (isNaN(numericVal) || numericVal <= 0) {
                showToast("Inserisci un prezzo valido");
                return;
            }

            const description = descriptionInput.value.trim().slice(0, 14);
            const addedItem = { id: Date.now(), price: numericVal, quantity: currentQty, description };
            cart.unshift(addedItem);
            lastPrice = numericVal;
            saveAndRender();
            showToast(`Aggiunto: ${numericVal.toFixed(2).replace('.', ',')} € (x${currentQty})`, () => {
                const addedIndex = cart.findIndex(item => item.id === addedItem.id);
                if (addedIndex === -1) return false;
                cart.splice(addedIndex, 1);
                lastPrice = cart.length > 0 ? cart[0].price : 0;
                saveAndRender();
                return true;
            });

            currentInput = "0,00";
            currentQty = 1;
            qtyDisplay.innerText = "1";
            descriptionInput.value = "";
            formatDisplayInput();
        });

        function saveAndRender() {
            localStorage.setItem('cart', JSON.stringify(cart));
            localStorage.setItem('lastPrice', lastPrice);
            updateUI();
        }

        function updateUI() {
            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const totalItemsCount = cart.reduce((sum, item) => sum + item.quantity, 0);
            const formattedTotal = total.toFixed(2).replace('.', ',') + ' €';
            const formattedLast = lastPrice.toFixed(2).replace('.', ',') + ' €';

            totalDisplay.innerText = formattedTotal;
            lastPriceDisplay.innerText = formattedLast;
            listTotal.innerText = "Tot: " + formattedTotal;
            itemCount.innerText = totalItemsCount;

            itemsContainer.innerHTML = cart.length === 0 ? '<p style="text-align:center; color:#777; margin-top:30px;">Carrello vuoto</p>' : '';
            
            cart.forEach((item, index) => {
                const subtotal = (item.price * item.quantity).toFixed(2).replace('.', ',');
                const row = document.createElement('div');
                row.className = 'item-row';
                const displayDescription = item.description && item.description.trim()
                    ? item.description.trim()
                    : `Art. ${cart.length - index}`;
                row.innerHTML = `
                    <div class="item-info">
                        <strong>${escapeHtml(displayDescription)}</strong>
                        <div class="item-price-line">
                            <span>${item.price.toFixed(2).replace('.', ',')} € cad.</span>
                            <button class="edit-price-btn" type="button" onclick="editItem(${item.id})" aria-label="Modifica descrizione e prezzo articolo ${cart.length - index}" title="Modifica descrizione e prezzo">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M12 20h9"/>
                                    <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="qty-controls">
                        <button class="qty-btn" onclick="changeQty(${item.id}, -1)" aria-label="Diminuisci quantità">−</button>
                        <span class="qty-val">${item.quantity}</span>
                        <button class="qty-btn" onclick="changeQty(${item.id}, 1)" aria-label="Aumenta quantità">+</button>
                    </div>
                    <div class="item-actions">
                        <div class="item-subtotal">${subtotal} €</div>
                        <button class="del-btn" type="button" onclick="confirmRemove(${item.id})" aria-label="Elimina articolo" title="Elimina articolo">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M3 6h18"/>
                                <path d="M8 6V4h8v2"/>
                                <path d="M19 6l-1 14H6L5 6"/>
                                <path d="M10 11v5"/>
                                <path d="M14 11v5"/>
                            </svg>
                        </button>
                    </div>
                `;
                itemsContainer.appendChild(row);
            });
        }

        window.changeQty = function(id, delta) {
            const item = cart.find(i => i.id === id);
            if (item) {
                item.quantity += delta;
                if (item.quantity < 1) {
                    item.quantity = 1;
                }
                saveAndRender();
            }
        }

        function escapeHtml(value) {
            return String(value).replace(/[&<>"']/g, character => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            })[character]);
        }

        window.editItem = function(id) {
            const item = cart.find(i => i.id === id);
            if (!item) return;

            const articleIndex = cart.findIndex(i => i.id === id);
            const articleNumber = cart.length - articleIndex;
            const articleLabel = `Art. ${articleNumber}`;

            editingItemId = id;
            editDescriptionLabel.textContent = `Nuova descrizione per ${articleLabel}`;
            editPriceLabel.textContent = `Nuovo prezzo per ${articleLabel}`;
            editDescriptionInput.placeholder = `Lascia vuoto per ${articleLabel}`;
            editDescriptionInput.value = item.description || '';
            editPriceInput.value = item.price.toFixed(2).replace('.', ',');
            editError.textContent = '';
            editModal.classList.add('active');
            editModal.setAttribute('aria-hidden', 'false');
            editDescriptionInput.focus({ preventScroll: true });
        };

        function closeEditModal() {
            editModal.classList.remove('active');
            editModal.setAttribute('aria-hidden', 'true');
            editItemForm.reset();
            editError.textContent = '';
            editingItemId = null;
        }

        cancelEditBtn.addEventListener('click', closeEditModal);

        editModal.addEventListener('click', event => {
            if (event.target === editModal) closeEditModal();
        });

        document.addEventListener('keydown', event => {
            if (event.key === 'Escape' && editModal.classList.contains('active')) {
                closeEditModal();
            }
        });

        editItemForm.addEventListener('submit', event => {
            event.preventDefault();
            const item = cart.find(i => i.id === editingItemId);
            if (!item) {
                closeEditModal();
                return;
            }

            const description = editDescriptionInput.value.trim();
            const enteredPrice = editPriceInput.value.trim();

            if (description.length > 14) {
                editError.textContent = 'La descrizione può contenere al massimo 14 caratteri.';
                editDescriptionInput.focus();
                return;
            }
            if (enteredPrice.length > 9 || !/^\d{1,6}(?:[.,]\d{1,2})?$/.test(enteredPrice)) {
                editError.textContent = 'Prezzo non valido: usa fino a 6 cifre intere e 2 decimali, ad esempio 12,50.';
                editPriceInput.focus();
                return;
            }

            const newPrice = Number(enteredPrice.replace(',', '.'));
            if (!Number.isFinite(newPrice) || newPrice <= 0) {
                editError.textContent = 'Il prezzo deve essere maggiore di zero.';
                editPriceInput.focus();
                return;
            }

            item.description = description;
            item.price = newPrice;
            if (cart[0] && cart[0].id === item.id) {
                lastPrice = newPrice;
            }

            closeEditModal();
            saveAndRender();
            showToast('Articolo aggiornato', null, 2000);
        });

        window.confirmRemove = function(id) {
            if (confirm("Sei sicuro di voler eliminare questo articolo?")) {
                const wasLatest = cart[0] && cart[0].id === id;
                cart = cart.filter(item => item.id !== id);
                if (cart.length === 0) {
                    lastPrice = 0;
                } else if (wasLatest) {
                    lastPrice = cart[0].price;
                }
                saveAndRender();
            }
        }

        openList.addEventListener('click', (e) => {
            e.preventDefault();
            listView.classList.add('active');
        });

        closeList.addEventListener('click', (e) => {
            e.preventDefault();
            listView.classList.remove('active');
        });

        document.getElementById('clearBtn').addEventListener('click', (e) => {
            e.preventDefault();
            if (confirm("Svuotare interamente il carrello?")) { 
                cart = []; 
                lastPrice = 0;
                saveAndRender(); 
            }
        });
        
        function positionToast() {
            // Posiziona il centro del messaggio a metà tra AGGIUNGI e il tastierino.
            const container = document.querySelector('.container');
            const keypad = document.querySelector('.keypad');
            const addRect = addBtn.getBoundingClientRect();
            const keypadRect = keypad.getBoundingClientRect();
            const containerRect = container.getBoundingClientRect();
            const midpoint = (addRect.bottom + keypadRect.top) / 2;
            toast.style.top = `${midpoint - containerRect.top}px`;
        }

        function showToast(msg, onUndo = null, duration = 4000) {
            if (toastTimeout) clearTimeout(toastTimeout);
            toast.replaceChildren();

            const message = document.createElement('span');
            message.className = 'toast-message';
            message.textContent = msg;
            toast.appendChild(message);

            if (typeof onUndo === 'function') {
                const undoButton = document.createElement('button');
                undoButton.type = 'button';
                undoButton.className = 'toast-undo-btn';
                undoButton.textContent = 'ANNULLA';
                undoButton.addEventListener('click', () => {
                    if (toastTimeout) clearTimeout(toastTimeout);
                    const undone = onUndo();
                    toast.replaceChildren();
                    const feedback = document.createElement('span');
                    feedback.className = 'toast-message';
                    feedback.textContent = undone ? 'Inserimento annullato' : 'Articolo non più presente';
                    toast.appendChild(feedback);
                    toast.classList.add('show');
                    positionToast();
                    toastTimeout = setTimeout(() => toast.classList.remove('show'), 1800);
                });
                toast.appendChild(undoButton);
            }

            toast.classList.add('show');
            positionToast();
            toastTimeout = setTimeout(() => toast.classList.remove('show'), duration);
        }
    </script>
</body>
</html>
